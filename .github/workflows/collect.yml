name: collect

on:
  schedule:
    - cron: "*/5 * * * *"     # GitHub may delay runs by several minutes under load
    # GitHub drops most */5 runs on free repos (~3-5 runs/day in practice). The day feed
    # backfills the whole day, so one run after closing captures it completely.
    # Times are UTC; campus is CST (UTC-6) through the end of the semester.
    # Several slots because GitHub drops individual scheduled runs too (11/28: 04:40 ran,
    # 05:20 did not). All are before local midnight, so any one of them is enough.
    - cron: "40 4 * * *"      # 22:40 CST: after Fri/Sat/Sun 22:00 close
    - cron: "5 5 * * *"       # 23:05 CST: after Mon-Thu 23:00 close (and all other days)
    - cron: "20 5 * * *"      # 23:20 CST
    - cron: "35 5 * * *"      # 23:35 CST
    - cron: "50 5 * * *"      # 23:50 CST
  workflow_dispatch: {}        # lets you press "Run workflow" to test by hand

# never run two collectors at once (they would race on the git push)
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4          # main branch = your code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Data lives on its own branch ("data") so pushes to main never conflict with the bot.
      - name: Prepare data branch
        run: |
          set -e
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git worktree add --detach databranch FETCH_HEAD
          else
            # first run: create the branch, seeded with any data/ folder already on main
            rm -rf /tmp/seed && mkdir /tmp/seed
            if [ -d data ]; then cp -r data/. /tmp/seed/; fi
            git worktree add --detach databranch
            git -C databranch checkout --orphan data
            git -C databranch rm -rf . > /dev/null
            cp -r /tmp/seed/. databranch/
          fi

      - name: Poll counts
        run: |
          # closing-time runs (every schedule except */5) must fetch day+week even if an
          # earlier run was <55 min ago
          case "${{ github.event.schedule }}" in
            "*/5 * * * *"|"") python collect.py --data-dir databranch ;;
            *) python collect.py --data-dir databranch --sources all ;;
          esac

      - name: Commit data
        working-directory: databranch
        run: |
          git config user.name  "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:data
          fi
