name: collect

on:
  schedule:
    - cron: "*/5 * * * *"     # GitHub may delay runs by several minutes under load
  workflow_dispatch: {}        # lets you press "Run workflow" to test by hand

# never run two collectors at once (they would race on the git push)
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll counts
        run: python collect.py
        env:
          COUNTS_URL: ${{ vars.COUNTS_URL }}

      - name: Commit data
        run: |
          git config user.name  "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
